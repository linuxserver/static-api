[project]
name = "lsio-static-api"
version = "1.1.0"
description = "The LinuxServer.io API as a static site: JSON endpoints, OpenAPI spec and docs, refreshed by CI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.162.0",
  "httpx2==2.16.0",
  "jinja2==3.1.6",
  "markdown-it-py==4.2.0",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "openapi-spec-validator==0.9.0",
  "pytest==9.1.1",
  "ruff==0.17.2",
  "types-PyYAML==6.0.12.20260906",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lsio_api", "lsio_api.sources"]

[tool.setuptools.package-data]
lsio_api = ["templates/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
