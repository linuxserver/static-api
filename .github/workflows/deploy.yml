# Refreshes the data, commits it, builds the site and publishes it to GitHub Pages: daily (the original
# API refreshed every 24 hours), on every push to main, and on demand from the Actions tab.
#
# Secrets: SCARF_TOKEN for monthly pull counts. Without it the previous counts are kept and
# status.json reports scarf as failed. GITHUB_TOKEN is provided by Actions.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Refresh data
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCARF_TOKEN: ${{ secrets.SCARF_TOKEN }}
        run: python -m lsio_api.refresh

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh data"
            # main may have moved since the checkout; only this step writes data/, so the rebase is clean.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python -m lsio_api.build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
